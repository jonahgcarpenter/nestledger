[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nestledger"
version = "0.1.0"
description = "Local IRA allocation planning and credit-card spending analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.1,<4",
    "gunicorn>=23,<24",
]

[project.scripts]
nestledger = "nestledger.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nestledger = [
    "static/*.css",
    "templates/*.html",
    "templates/*/*.html",
    "templates/*/*/*.html",
]
