<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Spending{% endblock %} | Personal Finance Lab</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='spending.css') }}">
</head>
<body>
  <main class="shell">
    <nav class="nav" aria-label="Primary navigation">
      <a class="brand" href="{{ url_for('spending') }}">Personal Finance Lab</a>
      <div class="nav-links">
        <a href="{{ url_for('index') }}">IRA strategies</a>
        <a href="{{ url_for('spending') }}"{% if request.endpoint == 'spending' %} class="active"{% endif %}>Spending</a>
        <a href="{{ url_for('import_statement_pdf') }}"{% if request.endpoint in ('import_statement_pdf', 'review_import') %} class="active"{% endif %}>Import</a>
        <a href="{{ url_for('merchant_filters') }}"{% if request.endpoint in ('merchant_filters', 'add_category', 'rename_category', 'remove_category') %} class="active"{% endif %}>Filters</a>
      </div>
    </nav>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}" role="status">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
